[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ran6g-optimizer"
version = "0.2.0"
description = "AI-powered 6G RAN optimization: synthetic simulation, QoS/beam/anomaly models, and a serving API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "erdioz" }]
keywords = ["6G", "RAN", "machine-learning", "beamforming", "anomaly-detection"]

dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "joblib>=1.3,<2.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
ran6g = "ran6g.cli:main"

[tool.setuptools]
# Existing top-level packages are treated as the distribution's packages.
packages = [
    "data",
    "models",
    "pipeline",
    "simulation",
    "visualization",
    "api",
    "ran6g",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["data", "models", "pipeline", "simulation", "visualization", "api", "ran6g"]
omit = ["*/__init__.py", "notebooks/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["data", "models", "pipeline", "simulation", "visualization", "api", "ran6g"]
